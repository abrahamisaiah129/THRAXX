<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .car-body {
        animation: jump 7s infinite ease-in-out;
        transform-origin: bottom center;
      }
      .dot {
        animation: pulse 1.2s infinite ease-in-out;
      }
      .dot1 { animation-delay: 0s; }
      .dot2 { animation-delay: 0.2s; }
      .dot3 { animation-delay: 0.4s; }

      @keyframes jump {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Thinking dots -->
  <circle class="dot dot1" cx="170" cy="110" r="7" fill="#0055ff" />
  <circle class="dot dot2" cx="200" cy="110" r="7" fill="#0055ff" />
  <circle class="dot dot3" cx="230" cy="110" r="7" fill="#0055ff" />

  <g class="car-body">
    <!-- Car body -->
    <rect x="80" y="150" width="240" height="115" fill="#0055ff" opacity="0.85" />

    <!-- Eyes: narrowed, looking up in thought -->
    <rect x="145" y="188" width="40" height="14" fill="#ffffff" opacity="0.9" />
    <rect x="215" y="188" width="40" height="14" fill="#ffffff" opacity="0.9" />

    <!-- Mouth: neutral -->
    <path d="M 170 235 L 230 235" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Legs -->
    <rect x="110" y="265" width="40" height="40" fill="#001a4d" opacity="0.9" />
    <rect x="250" y="265" width="40" height="40" fill="#001a4d" opacity="0.9" />
  </g>
</svg>
