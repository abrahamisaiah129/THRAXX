<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .car-body {
        animation: jump 7s infinite ease-in-out;
        transform-origin: bottom center;
      }

      .mouth-neutral {
        animation: mouthSwap 6s infinite ease-in-out;
      }
      .mouth-smile {
        animation: mouthSwap 6s infinite ease-in-out reverse;
      }

      @keyframes mouthSwap {
        0%, 60% { opacity: 1; }
        75%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }

      .eye {
        animation: squint 3s infinite ease-in-out;
        transform-origin: center;
      }
      .left-eye { transform-origin: 165px 195px; }
      .right-eye { transform-origin: 235px 195px; }

      @keyframes jump {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-18px); }
      }

      @keyframes squint {
        0%, 70%, 100% { transform: scaleY(1); }
        80% { transform: scaleY(0.5); }
        90% { transform: scaleY(0.08); }
        95% { transform: scaleY(0.5); }
      }
    </style>
  </defs>

  <g class="car-body">
    <!-- Car body: square, flat, minimalist -->
    <rect x="80" y="150" width="240" height="115" fill="#0055ff" opacity="0.85" />

    <!-- Eyes (square windows) -->
    <rect class="eye left-eye"  x="145" y="180" width="40" height="30" fill="#ffffff" opacity="0.9" />
    <rect class="eye right-eye" x="215" y="180" width="40" height="30" fill="#ffffff" opacity="0.9" />

    <!-- Mouth: smoothly morphs from neutral to smile -->
    <path stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"
      d="M 165 235 Q 200 235 235 235">
      <animate attributeName="d"
        values="M 165 235 Q 200 235 235 235;M 160 230 Q 200 250 240 230;M 165 235 Q 200 235 235 235"
        keyTimes="0;0.5;1"
        dur="8s"
        calcMode="spline"
        keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
        repeatCount="indefinite" />
    </path>

    <!-- Legs (square) -->
    <rect x="110" y="265" width="40" height="40" fill="#001a4d" opacity="0.9" />
    <rect x="250" y="265" width="40" height="40" fill="#001a4d" opacity="0.9" />
  </g>
</svg>
